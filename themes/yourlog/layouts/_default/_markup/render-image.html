{{- if .IsBlock -}}
<figure class="post-figure">
  <a href="{{ .Destination | safeURL }}" target="_blank" rel="noopener"><img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy"></a>
  {{- with .Title }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
{{- else -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy">
{{- end -}}
