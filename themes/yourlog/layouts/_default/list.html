{{ define "main" }}

<section class="hero">
  <p class="eyebrow">カテゴリ</p>
  <h1>{{ .Title }}</h1>
</section>

<section class="articles">
  <ul class="article-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time class="mono" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01.02" }}</time>
    </li>
    {{ end }}
  </ul>
</section>

{{ end }}
