<section class="status-panel" aria-label="サーバー稼働状況">
  <div class="status-item">
    <span class="status-label">STATUS</span>
    <span class="status-value"><i class="dot" aria-hidden="true"></i>稼働中</span>
  </div>
  <div class="status-item">
    <span class="status-label">SERVER</span>
    <span class="status-value mono">{{ .Site.Params.statusServer | default "ConoHa VPS" }}</span>
  </div>
  <div class="status-item">
    <span class="status-label">STACK</span>
    <span class="status-value mono">{{ .Site.Params.statusStack | default "Nginx / Hugo" }}</span>
  </div>
  <div class="status-item">
    <span class="status-label">UPTIME</span>
    <span class="status-value mono">{{ .Site.Params.statusUptime | default "—" }}</span>
  </div>
</section>
